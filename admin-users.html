<!DOCTYPE html>
<html>
<head>
  <title>Manage Users</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body" onload="checkAdmin(); loadAdminDashboard(); loadAdminUsersTable(); loadUserInfo();">
  <aside class="sidebar">
    <div class="logo"><span>S</span><h2>SmartCoop</h2></div>

    <nav>
      <a href="admin-dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="admin-users.html" class="active"><i data-lucide="users"></i> Manage Users</a>
      <a href="admin-reports.html"><i data-lucide="bar-chart"></i> Reports & Analytics</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div></div>
      <div class="top-profile">
        <button class="profile-trigger" onclick="toggleProfileMenu()">
          <div class="avatar" id="userAvatarTop">A</div>
          <span id="topUsername">Admin</span>
          <i data-lucide="chevron-down"></i>
        </button>

        <div id="profileDropdown" class="profile-dropdown hidden">
          <div class="dropdown-user">
            <strong id="dropdownName">Admin</strong>
            <p id="dropdownEmail">admin@smartcoop.com</p>
            <small>SmartCoop Admin</small>
          </div>
          <button type="button" onclick="window.location.href='user.html'">Switch to User</button>
          <button type="button" class="logout-link" onclick="logout()">Logout</button>
        </div>
      </div>
    </header>

    <section class="content admin-content">
      <div class="admin-users-kpis">
        <div class="admin-users-card">
          <p>Total Users</p>
          <h2 id="adminTotalUsers">4</h2>
        </div>

        <div class="admin-users-card">
          <p>Active Users</p>
          <h2 id="adminActiveUsers">3</h2>
        </div>

        <div class="admin-users-card">
          <p>Total Projects</p>
          <h2>320</h2>
        </div>
      </div>

      <div class="admin-users-panel">
        <div class="admin-users-head">
          <h2>Manage Users</h2>
          <button onclick="addAdminUser()">Add User +</button>
        </div>

        <div class="admin-users-tools">
          <div class="admin-users-search">
            <i data-lucide="search"></i>
            <input id="adminSearchUser" placeholder="Search users..." oninput="loadAdminUsersTable()">
          </div>

          <select id="adminStatusFilter" onchange="loadAdminUsersTable()">
            <option value="All">All Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>

          <select id="adminRoleFilter" onchange="loadAdminUsersTable()">
            <option value="All">All Roles</option>
            <option value="Admin">Admin</option>
            <option value="User">User</option>
          </select>
        </div>

        <table class="admin-users-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminUsersTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- EDIT USER MODAL -->
  <div id="editUserModal" class="admin-modal hidden">
    <div class="admin-modal-card">
      <button class="admin-modal-close" onclick="closeEditUserModal()">×</button>

      <h2>Edit User</h2>

      <input type="hidden" id="editOriginalEmail">

      <div class="input-group">
        <label>Name *</label>
        <input id="editUserName" type="text">
      </div>

      <div class="input-group">
        <label>Email *</label>
        <input id="editUserEmail" type="email">
      </div>

      <div class="input-group">
        <label>Role</label>
        <select id="editUserRole">
          <option>Admin</option>
          <option>User</option>
        </select>
      </div>

      <div class="input-group">
        <label>Status</label>
        <select id="editUserStatus">
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>

      <div class="admin-modal-actions">
        <button class="cancel-btn" onclick="closeEditUserModal()">Cancel</button>
        <button class="save-btn" onclick="saveEditedUser()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
