<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SmartCoop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-wrapper">
    <section class="brand-header">
      <div class="logo-box">S</div>
      <div>
        <h1>SmartCoop</h1>
        <p>Smart Poultry Management</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="card-header">
        <h2>Welcome back</h2>
        <p>Enter your credentials to access your account</p>
      </div>

      <form id="loginForm" class="form-stack">
        <div class="input-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="farmer@smartcoop.com" autocomplete="email" required />
        </div>

        <div class="input-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" class="small-link">Forgot?</a>
          </div>
          <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
        </div>

        <div id="loginError" class="error-box hidden"></div>

        <label class="check-row">
          <input id="remember" type="checkbox" />
          <span>Remember me</span>
        </label>

        <button type="submit" class="primary-btn" id="loginBtn">Sign in</button>
      </form>

      <div class="divider">
        <span>or continue with</span>
      </div>

      <div class="social-login">
        <button type="button" class="google-btn" onclick="socialLogin('Google')">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" />
        Continue with Google
        </button>
      </div>

      <div class="demo-box">
        <p class="demo-title">Demo Credentials:</p>
        <p><strong>Farmer:</strong> farmer@smartcoop.com / password</p>
        <p><strong>Admin:</strong> admin@smartcoop.com / admin</p>
      </div>

      <div class="auth-footer">
        Don&apos;t have an account?
        <a href="signup.html">Sign up</a>
      </div>
    </section>

    <div class="auth-footer">
  <a href="index.html" class="back-home">← Back to Home</a>
</div>

  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="js/auth.js"></script>
</body>
</html>
